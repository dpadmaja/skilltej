<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skilltej Academy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Skilltej Logo" />
    <div class="brand blue">Academy</div>
    <a class="home-link" href="index.html">🏠 Home</a>
    <a class="auth-btn outline" href="#">Sign In</a>
    <a class="auth-btn solid" href="#">Sign Up</a>
  </header>

  <main>
    <section class="page-title">
      <h2>🎓 Skilltej Academy</h2>
      <p>Master the core subjects, one step at a time.</p>
    </section>

    <section class="grid">
      <button class="card c-blue">
        <span class="emoji">📐</span>
        <span>Mathematics</span>
      </button>

      <button class="card c-purple">
        <span class="emoji">⚡</span>
        <span>Physics</span>
      </button>

      <button class="card c-green">
        <span class="emoji">🌱</span>
        <span>Biology</span>
      </button>

      <button class="card c-orange">
        <span class="emoji">🧪</span>
        <span>Chemistry</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-copy">&copy; 2026 Skilltej. All rights reserved</span>
  </footer>

</body>
</html>
