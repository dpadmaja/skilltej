<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skilltej Kids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Skilltej Logo" />
    <div class="brand rainbow">Kids</div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-blob blob-1"></div>
      <div class="hero-blob blob-2"></div>
      <div class="hero-inner">
        <div class="quote">
          <span class="w1">Learn</span><span class="w1 t2"> Today</span><span class="comma">,</span>
          <span class="w2">Think</span><span class="w2 t2"> Tomorrow</span><span class="comma">,</span>
          <span class="w3">Create</span><span class="w3 t2"> Future</span>
        </div>
        <p class="tagline">Little minds, big futures — choose your learning playground.</p>
      </div>
    </section>

    <section class="grid grid-five">
      <button class="card c-blue" onclick="location.href='academy.html'">
        <span class="emoji">🎓</span>
        <span>Academy</span>
      </button>

      <button class="card c-purple" onclick="location.href='oly.html'">
        <span class="emoji">🏆</span>
        <span>Oly</span>
      </button>

      <button class="card c-orange" onclick="location.href='stemlabs.html'">
        <span class="emoji">🧪</span>
        <span>Stem labs</span>
      </button>

      <button class="card c-green" onclick="location.href='futureskills.html'">
        <span class="emoji">🚀</span>
        <span>Future Skills</span>
      </button>

      <button class="card c-cyan" onclick="location.href='lang.html'">
        <span class="emoji">💬</span>
        <span>Lang</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-copy">&copy; 2026 Skilltej. All rights reserved</span>
  </footer>

</body>
</html>
