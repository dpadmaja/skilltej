<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skilltej Kids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Skilltej Logo" />
    <div class="brand rainbow">Kids</div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-glow"></div>
      <div class="hero-blob blob-1"></div>
      <div class="hero-blob blob-2"></div>
      <div class="hero-grid-lines"></div>
      <div class="hero-inner">
        <div class="quote">
          <span class="w1">Learn</span><span class="w1 t2"> Today</span><span class="comma">,</span>
          <span class="w2">Think</span><span class="w2 t2"> Tomorrow</span><span class="comma">,</span>
          <span class="w3">Create</span><span class="w3 t2"> Future</span>
        </div>
        <p class="tagline">Little minds, big futures — choose your learning playground.</p>
      </div>
    </section>

    <section class="grid grid-five">
      <button class="card c-blue" onclick="location.href='academy.html'">
        <span class="icon-tile t-azure">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l10 4-10 4L2 7z"></path>
            <path d="M6 9v4c0 1.5 2.7 3 6 3s6-1.5 6-3V9"></path>
            <path d="M22 7v4"></path>
          </svg>
        </span>
        <span class="card-label">Academy</span>
        <span class="card-sub">Core subjects mastery</span>
      </button>

      <button class="card c-purple" onclick="location.href='oly.html'">
        <span class="icon-tile t-indigo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4h8v5a4 4 0 0 1-8 0z"></path>
            <path d="M8 5H4v2a3 3 0 0 0 3 3h1M16 5h4v2a3 3 0 0 1-3 3h-1"></path>
            <path d="M12 13v3M9 20h6M10 16h4v4"></path>
          </svg>
        </span>
        <span class="card-label">Oly</span>
        <span class="card-sub">Olympiad excellence</span>
      </button>

      <button class="card c-orange" onclick="location.href='stemlabs.html'">
        <span class="icon-tile t-amber">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2h4M11 2v7L4.5 18.5A2 2 0 0 0 6.2 22h11.6a2 2 0 0 0 1.7-3.5L13 9V2"></path>
            <path d="M7 17h10"></path>
          </svg>
        </span>
        <span class="card-label">Stem labs</span>
        <span class="card-sub">Hands-on experiments</span>
      </button>

      <button class="card c-green" onclick="location.href='futureskills.html'">
        <span class="icon-tile t-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2c3 2 5 5.5 5 9l-5 5-5-5c0-3.5 2-7 5-9z"></path>
            <circle cx="12" cy="9" r="1.8"></circle>
            <path d="M7 12l-2 2M17 12l2 2M9 19l-1 3 3-2M15 19l1 3-3-2"></path>
          </svg>
        </span>
        <span class="card-label">Future Skills</span>
        <span class="card-sub">Future-ready abilities</span>
      </button>

      <button class="card c-cyan" onclick="location.href='lang.html'">
        <span class="icon-tile t-cyan">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 5v9a2 2 0 0 1-2 2H9l-4 4v-4H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <circle cx="8" cy="9.5" r="1" fill="#ffffff" stroke="none"></circle>
            <circle cx="12" cy="9.5" r="1" fill="#ffffff" stroke="none"></circle>
            <circle cx="16" cy="9.5" r="1" fill="#ffffff" stroke="none"></circle>
          </svg>
        </span>
        <span class="card-label">Lang</span>
        <span class="card-sub">Speak &amp; write with flair</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-copy">&copy; 2026 Skilltej. All rights reserved</span>
  </footer>

</body>
</html>
