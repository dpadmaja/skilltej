<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skilltej Lang</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Skilltej Logo" />
    <div class="brand cyan">Lang</div>
    <a class="home-link" href="index.html">🏠 Home</a>
    <button type="button" class="auth-btn outline" onclick="openPopup('signin')">Sign In</button>
    <button type="button" class="auth-btn solid" onclick="openPopup('signup')">Sign Up</button>
  </header>

  <main>
    <section class="page-title">
      <h2>💬 Skilltej Lang</h2>
      <p>Build strong language skills, word by word.</p>
    </section>

    <section class="grid">
      <button class="card c-purple">
        <span class="emoji">🗣️</span>
        <span>Improve Language skills</span>
      </button>

      <button class="card c-blue">
        <span class="emoji">📚</span>
        <span>Comprehension</span>
      </button>

      <button class="card c-orange">
        <span class="emoji">✍️</span>
        <span>Composition</span>
      </button>

      <button class="card c-green">
        <span class="emoji">🔤</span>
        <span>Vocab</span>
      </button>
    </section>
  </main>

<footer class="footer">
    <span class="footer-copy">All rights reserved</span>
  </footer>

  <div class="modal-overlay" id="signin-modal">
    <div class="modal">
      <button type="button" class="modal-close" onclick="closeModals()">&times;</button>
      <h2>Welcome Back</h2>
      <p class="modal-sub">Sign in to your Skilltej account</p>
      <form onsubmit="return false">
        <input type="text" placeholder="Username" />
        <input type="password" placeholder="Password" />
        <button type="submit" class="modal-submit">Sign In</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="signup-modal">
    <div class="modal">
      <button type="button" class="modal-close" onclick="closeModals()">&times;</button>
      <h2>Create Account</h2>
      <p class="modal-sub">Join Skilltej Kids</p>
      <form onsubmit="return false">
        <div class="form-row">
          <input type="text" placeholder="First Name" />
          <input type="text" placeholder="Last Name" />
        </div>
        <div class="form-row">
          <input type="text" placeholder="Username" />
          <input type="password" placeholder="Password" />
        </div>
        <div class="form-row">
          <input type="text" placeholder="Grade" />
          <input type="text" placeholder="School" />
          <input type="text" placeholder="City" />
        </div>
        <input type="tel" placeholder="Mobile" />
        <input type="email" placeholder="Email" />
        <button type="submit" class="modal-submit">Sign Up</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
