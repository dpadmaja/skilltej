<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skilltej Stemlabs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <img class="logo" src="logo.jpg" alt="Skilltej Logo" />
    <div class="brand green">STEM</div>
    <a class="home-link" href="index.html">🏠 Home</a>
    <a class="auth-btn outline" href="#">Sign In</a>
    <a class="auth-btn solid" href="#">Sign Up</a>
  </header>

  <main>
    <section class="page-title">
      <h2>🧪 Skilltej Stemlabs</h2>
      <p>Experiment, build, and discover through STEM.</p>
    </section>

    <section class="grid">
      <button class="card c-blue">
        <span class="emoji">🔬</span>
        <span>Science</span>
      </button>

      <button class="card c-cyan">
        <span class="emoji">💻</span>
        <span>Technology</span>
      </button>

      <button class="card c-orange">
        <span class="emoji">⚙️</span>
        <span>Engineering</span>
      </button>

      <button class="card c-purple">
        <span class="emoji">📐</span>
        <span>Mathematics</span>
      </button>
    </section>
  </main>

  <footer class="footer">
    <span class="footer-copy">&copy; 2026 Skilltej. All rights reserved</span>
  </footer>
