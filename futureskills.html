<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Skilltej Future Skills</title>
  <link rel="stylesheet" href="style.css" />

    <a class="auth-btn outline" href="#">Sign In</a>
